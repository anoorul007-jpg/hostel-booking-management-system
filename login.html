<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Portal Login - Hostel Booking and Management System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 150px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    .auth-box {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-xl);
      padding: 2.5rem;
    }
    .role-tabs {
      display: flex;
      background: var(--bg-alt);
      padding: 0.35rem;
      border-radius: var(--radius-md);
      margin-bottom: 2rem;
    }
    .role-tab {
      flex: 1;
      text-align: center;
      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      background: transparent;
      transition: var(--transition);
      color: var(--text-muted);
    }
    .role-tab.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .demo-accounts {
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
    }
    .demo-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.6rem 0.85rem;
      background: var(--bg-alt);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: left;
      transition: var(--transition);
    }
    .demo-btn:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">🏢</div>
        Hostel<span>Master</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="rooms.html">Rooms & Blocks</a></li>
        <li><a href="facilities.html">Facilities</a></li>
        <li><a href="complaints.html">Complaints</a></li>
      </ul>

      <div class="nav-actions">
        <a href="register.html" class="btn btn-sm btn-primary">Student Register</a>
      </div>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-box">
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <div class="brand-icon" style="margin: 0 auto 1rem; width: 50px; height: 50px; font-size: 1.6rem;">🔐</div>
        <h2>Sign in to Portal</h2>
        <p>Access your hostel room, payment records, and services.</p>
      </div>

      <!-- Role Selector Tabs -->
      <div class="role-tabs">
        <button type="button" class="role-tab active" id="tab-student" onclick="setRole('student')">Student Login</button>
        <button type="button" class="role-tab" id="tab-admin" onclick="setRole('admin')">Admin / Warden</button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="form-group">
          <div class="flex justify-between items-center" style="margin-bottom: 0.4rem;">
            <label for="password" style="margin-bottom: 0;">Password</label>
            <a href="#" onclick="alert('For testing: use password123 for students and admin123 for administrator.'); return false;" style="font-size: 0.8rem;">Forgot password?</a>
          </div>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;" id="loginBtn">
          Sign In ➔
        </button>
      </form>

      <!-- Instant Demo Login Shortcuts -->
      <div class="demo-accounts">
        <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.75rem;">
          ⚡ Quick Demo Accounts (1-Click Fill)
        </div>
        
        <button type="button" class="demo-btn" onclick="fillDemo('admin@hostel.com', 'admin123', 'admin')">
          <div>
            <strong>Hostel Administrator</strong>
            <div style="font-size: 0.75rem; color: var(--text-muted);">admin@hostel.com (Full Control)</div>
          </div>
          <span class="badge badge-ac">Fill</span>
        </button>

        <button type="button" class="demo-btn" onclick="fillDemo('rahul@student.com', 'password123', 'student')">
          <div>
            <strong>Rahul Sharma (Student)</strong>
            <div style="font-size: 0.75rem; color: var(--text-muted);">Room BlockA-201 (AC Attached)</div>
          </div>
          <span class="badge badge-available">Fill</span>
        </button>

        <button type="button" class="demo-btn" onclick="fillDemo('priya@student.com', 'password123', 'student')">
          <div>
            <strong>Priya Patel (Student)</strong>
            <div style="font-size: 0.75rem; color: var(--text-muted);">Room BlockC-102 (Girls Wing)</div>
          </div>
          <span class="badge badge-partial">Fill</span>
        </button>
      </div>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem;">
        New student? <a href="register.html" style="font-weight: 600;">Register online here</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    let currentRole = 'student';

    function setRole(role) {
      currentRole = role;
      document.getElementById('tab-student').classList.toggle('active', role === 'student');
      document.getElementById('tab-admin').classList.toggle('active', role === 'admin');
    }

    function fillDemo(email, pass, role) {
      setRole(role);
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
      showToast(`Filled credentials for ${email}`, 'info');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerText = 'Authenticating...';

      try {
        const res = await HostelAuth.login(email, password);
        if (res.success && res.user) {
          showToast(`Welcome back, ${res.user.name}!`, 'success');
          setTimeout(() => {
            if (res.user.role === 'admin') {
              window.location.href = 'admin-dashboard.html';
            } else {
              window.location.href = 'student-dashboard.html';
            }
          }, 800);
        } else {
          showToast(res.error || 'Invalid email or password', 'error');
          btn.disabled = false;
          btn.innerText = 'Sign In ➔';
        }
      } catch (err) {
        showToast('Login request failed', 'error');
        btn.disabled = false;
        btn.innerText = 'Sign In ➔';
      }
    });

    // If already logged in, redirect
    const active = HostelAuth.getUser();
    if (active) {
      // show notice or redirect
    }
  </script>
</body>
</html>
